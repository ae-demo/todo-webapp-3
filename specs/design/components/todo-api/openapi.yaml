openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages a signed-in user's personal tasks — creation, editing, completion, tagging, and filtering/sorting.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /tasks:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTasks
      summary: List the caller's tasks, filterable and sortable
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, completed] }
          description: filter by completion state
        - name: tag
          in: query
          schema: { type: string }
          description: filter by tag name
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high] }
          description: filter by priority
        - name: sort
          in: query
          schema: { type: string, enum: [dueDate, priority, createdAt] }
          description: sort field
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching tasks
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid task payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getTask
      summary: Get one task
      responses:
        '200':
          description: the task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateTask
      summary: Edit a task's title, tags, due date, priority, or completion state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid update payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTask
      summary: Delete a task
      responses:
        '204':
          description: task deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tasks/{taskId}/complete:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: completeTask
      summary: Mark a task complete
      responses:
        '200':
          description: task marked complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tasks/{taskId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reopenTask
      summary: Reopen a completed task
      responses:
        '200':
          description: task reopened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tags:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTags
      summary: List tags the caller has used, for filter suggestions
      responses:
        '200':
          description: tags in use
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [open, completed] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date, nullable: true }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [title, priority]
      properties:
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date, nullable: true }
        tags:
          type: array
          items: { type: string }
    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date, nullable: true }
        tags:
          type: array
          items: { type: string }
    Tag:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
